<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a7f66" />
    <title>تیزبازی · بدون اینترنت</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #050b14;
        color: #e6edf3;
        font-family: system-ui, Tahoma, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 28px;
        margin: 8px 0;
      }
      p {
        color: #9aa7b5;
        line-height: 2;
      }
      .emoji {
        font-size: 72px;
      }
      button {
        margin-top: 12px;
        min-height: 48px;
        padding: 0 32px;
        border: 0;
        border-radius: 14px;
        background: #1fd6a0;
        color: #04251c;
        font: inherit;
        font-weight: 800;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="emoji" aria-hidden="true">📡</div>
      <h1>اینترنت قطع است</h1>
      <p>تیزبازی برای ثبت امتیاز و لیدربورد به اینترنت نیاز دارد.<br />اتصال را بررسی کن و دوباره امتحان کن.</p>
      <button onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
